name: Update M3U Playlist

on:
  schedule:
    - cron: '0 2 * * *'   # প্রতিদিন UTC সময় 02:00-এ চলে (আপনি চাইলে পরিবর্তন করতে পারেন)
  workflow_dispatch:        # ম্যানুয়ালি ট্রিগার করার অনুমতি দেয়, পরীক্ষার জন্য সুবিধাজনক

permissions:
  contents: write           # ফাইল কমিট করার জন্য লেখার অনুমতি প্রয়োজন

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # রিপোজিটরি কোড চেকআউট করুন

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        run: python generate_m3u.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || git commit -m "update playlist"
          git push
